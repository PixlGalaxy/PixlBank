worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    # The entrypoint prefixes every nginx line with [FRONTEND].
    log_format pixlbank '$time_iso8601 $status $request_method $request_uri '
                          '${body_bytes_sent}b ${request_time}s "$http_user_agent"';
    access_log /dev/stdout pixlbank;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        # Receipts are capped at 10 MB by the backend; leave room for the form fields.
        client_max_body_size 12m;

        # Baseline hardening for every response. nginx drops server-level
        # add_header lines in any location that sets its own, so /assets/
        # repeats them below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            # Also tailed by the backend into the admin panel's own Logs page
            # as a FRONTEND channel — /backend/ below deliberately isn't, since
            # the backend's own request logger already covers those requests.
            access_log /dev/stdout pixlbank;
            access_log /tmp/nginx-access.log pixlbank;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            access_log /dev/stdout pixlbank;
            access_log /tmp/nginx-access.log pixlbank;
        }

        location /backend/ {
            proxy_pass http://127.0.0.1:4000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Some backend routes set nosniff themselves; keep only the server-level copy.
            proxy_hide_header X-Content-Type-Options;
            # The backend marks its event streams (dashboard metrics, logs) with
            # X-Accel-Buffering: no. nginx swallows X-Accel-* headers
            # from upstream by default; pass this one on so an outer nginx (e.g.
            # Nginx Proxy Manager) also streams them instead of buffering or
            # compressing them into silence.
            proxy_pass_header X-Accel-Buffering;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            # Receipt verification waits on the vision model, which can take a while on CPU.
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }
    }
}
